<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local task handoff demo</title><style>body{font:18px system-ui;max-width:850px;margin:5vh auto;padding:24px;background:#f4f5ef;color:#153d32}button,select{font:inherit;padding:12px;border:1px solid #9eb8aa;border-radius:8px;background:white;margin:5px}button:disabled{opacity:.45}header{display:flex;justify-content:space-between}main{background:white;padding:28px;border-radius:16px}pre{white-space:pre-wrap;font-size:14px}#badge{color:#856500}#error{color:#a82020}</style><header><p>ROBOT INTEGRATION FIELD NOTES</p><select id="lang" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select></header><main><h1 id="title"></h1><p id="badge"></p><p id="intro"></p><button id="start"></button><button id="stop"></button><button id="reset"></button><p><label><input type="checkbox" id="fail"><span id="failure"></span></label></p><h2 id="state"></h2><ol id="events"></ol><p id="error" role="alert"></p><details><summary id="raw"></summary><pre id="result"></pre></details></main><script>
const $=id=>document.getElementById(id);let latest={active:false,events:[]},lang=localStorage.getItem('demo-language')||'en';
const words={en:{title:'One local task. Five stages.',badge:'SIMULATION ONLY — no robot connected',intro:'Start, close the page, and reopen: the local process keeps running.',start:'Start demo',stop:'Request stop',reset:'Reset result',failure:'Simulate a drive failure',raw:'Raw result',idle:'Ready',running:'Running',completed:'Completed',failed:'Failed',cancelled:'Cancelled',observe:'Observe',plan:'Plan',drive:'Drive',restore:'Restore pose',grasp:'Grasp',started:'started'},zh:{title:'一个本机任务，五个阶段',badge:'仅模拟 — 没有连接机器人',intro:'点击开始后可以关闭网页，再打开查看结果；本机进程继续运行。',start:'开始模拟',stop:'请求停止',reset:'重置结果',failure:'模拟行驶失败',raw:'原始结果',idle:'就绪',running:'运行中',completed:'已完成',failed:'失败',cancelled:'已取消',observe:'观察',plan:'规划',drive:'行驶',restore:'恢复姿态',grasp:'抓取',started:'开始'}};
function render(){const w=words[lang];document.documentElement.lang=lang;$('lang').value=lang;for(const k of ['title','badge','intro','start','stop','reset','failure','raw'])$(k).textContent=w[k];$('start').disabled=latest.active;$('reset').disabled=latest.active;$('stop').disabled=!latest.active;$('state').textContent=w[latest.active?'running':latest.result?.state||'idle'];$('events').replaceChildren(...latest.events.map(e=>{const li=document.createElement('li');li.textContent=w[e.stage]+': '+w[e.state];return li}));$('result').textContent=JSON.stringify(latest.result,null,2);}
async function request(path,body){try{const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.error);latest=x;$('error').textContent='';render()}catch(e){$('error').textContent=e.message;}}
$('lang').onchange=()=>{lang=$('lang').value;localStorage.setItem('demo-language',lang);render()};$('start').onclick=()=>request('/start',{fail:$('fail').checked});$('stop').onclick=()=>request('/stop',{});$('reset').onclick=()=>request('/reset',{});render();request('/status');setInterval(()=>request('/status'),500);
</script></html>
